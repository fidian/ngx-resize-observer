<div
    #resizingElement
    (onResize)="handleResize($event)"
    [style.height.%]="heightDesired()"
    [style.width.%]="widthDesired()"
    style="border: 1px solid black; overflow: hidden; background-color: white"
>
    <div>This resizes automatically every 5 seconds</div>
    <div>Width: {{ widthReported() }} (desired: {{ widthDesired() }}%)</div>
    <div>Height: {{ heightReported() }} (desired: {{ heightDesired() }}%)</div>
    <div>Last updated from {{ triggeredBy() }}</div>
    <div>Check your console for events and and data</div>
</div>
